                        <input id="rating" name="rating" type="hidden" value="5">
                    </div>
                    <b id="ratingValue">5/5</b>
                </div>
                <div class="comment-row">
                    <textarea name="text" maxlength="500" placeholder="اكتب تعليقك..."></textarea>

        <div class="permission-modal" id="permissionModal" hidden role="dialog" aria-modal="true" aria-labelledby="permissionTitle">
            <div class="permission-card">
                <div class="permission-icon">⭐</div>
                <h3 id="permissionTitle">التقييم بعد المعاملة</h3>
                <p>تستطيع التعليق وتقييم تجربتك فقط بعد اجراء اي معاملة ناجحة في البوت</p>
                <button type="button" onclick="document.getElementById('permissionModal').hidden=true">حسنا</button>
            </div>
        </div>
        <script>
            ( () => {
                const box = document.getElementById('starsInput')
                  , input = document.getElementById('rating')
                  , label = document.getElementById('ratingValue')
                  , area = document.querySelector('textarea[name="text"]')
                  , edit = document.getElementById('editId')
                  , parent = document.getElementById('parentId')
                  , mode = document.getElementById('replyMode')
                  , modeLabel = document.getElementById('replyLabel')
                  , picker = document.querySelector('.rating-picker');
                if (!box || !input)
                    return;
                const stars = [...box.querySelectorAll('button[data-value]')];
                let value = 5;
                const setValue = n => {
                    value = Math.max(1, Math.min(5, Number(n) || 1));
                    input.value = String(value);
                    box.setAttribute('aria-valuenow', String(value));
                    if (label)
                        label.textContent = value + '/5';
                    stars.forEach( (s, i) => s.classList.toggle('off', i >= value))
                }
                ;
                const reset = () => {
                    edit.value = '';
                    parent.value = '';
                    mode.hidden = true;
                    picker.hidden = false;
                    area.placeholder = 'اكتب تعليقك...';
                    area.value = '';
                    setValue(5)
                }
                ;
                const replyMode = (id, name) => {
                    edit.value = '';
                    parent.value = id;
                    mode.hidden = false;
                    modeLabel.textContent = 'رد على ' + name;
                    picker.hidden = true;
                    area.placeholder = 'اكتب ردك...';
                    area.value = '';
                    area.focus();
                    area.scrollIntoView({
                        behavior: 'smooth',
                        block: 'center'
                    })
                }
                ;
                const fromPoint = x => {
                    const r = box.getBoundingClientRect();
                    return Math.ceil(((x - r.left) / r.width) * 5)
                }
                ;
                stars.forEach(s => s.addEventListener('click', () => setValue(s.dataset.value)));
                box.addEventListener('pointerdown', e => {
                    box.setPointerCapture?.(e.pointerId);
                    setValue(fromPoint(e.clientX));
                    e.preventDefault()
                }
                );
                box.addEventListener('pointermove', e => {
                    if (e.buttons || e.pressure > 0)
                        setValue(fromPoint(e.clientX))
                }
                );
                box.addEventListener('keydown', e => {
                    if (e.key === 'ArrowRight' || e.key === 'ArrowUp') {
                        setValue(value + 1);
                        e.preventDefault()
                    }
                    if (e.key === 'ArrowLeft' || e.key === 'ArrowDown') {
                        setValue(value - 1);
                        e.preventDefault()
                    }
                }
                );
                document.querySelectorAll('.reply-review').forEach(btn => btn.addEventListener('click', () => replyMode(btn.dataset.id, btn.dataset.name)));
                document.querySelectorAll('.edit-review').forEach(btn => btn.addEventListener('click', () => {
                    edit.value = btn.dataset.id;
                    parent.value = '';
                    mode.hidden = false;
                    modeLabel.textContent = 'تعديل تعليقك';
                    const isReply = btn.dataset.reply === '1';
                    picker.hidden = isReply;
                    area.placeholder = isReply ? 'عدّل ردك...' : 'عدّل تعليقك...';
                    area.value = btn.dataset.text || '';
                    if (!isReply)
                        setValue(btn.dataset.rating || 5);
                    area.focus();
                    area.scrollIntoView({
                        behavior: 'smooth',
                        block: 'center'
                    })
                }
                ));
                document.getElementById('cancelMode')?.addEventListener('click', reset);
                setValue(5)
            }
            )();
        </script>
        <script>
            ( () => {
                const modal = document.getElementById('permissionModal');
                const form = document.querySelector('.composer');
                if (!modal || !form)
                    return;
                form.addEventListener('submit', e => {
                    e.preventDefault();
                    e.stopImmediatePropagation();
                    modal.hidden = false;
                    modal.querySelector('button')?.focus()
                }
                , true);
                document.addEventListener('keydown', e => {
                    if (e.key === 'Escape')
                        modal.hidden = true
                }
                )
            }
            )();
        </script>
